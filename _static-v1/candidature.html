<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidater · Le Prix de la Trêve</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<main>
  <div class="page-head reveal"><h1>Déposer une candidature</h1>
    <p class="muted">Tes réponses sont sauvegardées automatiquement sur cet appareil. Un code de suivi te sera remis à l'envoi.</p></div>
  <div class="center"><div class="toggle" id="tabs">
    <button class="active" data-tab="staff">Staff</button><button data-tab="hr">Hauts Rangs</button><button data-tab="oc">OC supplémentaire</button>
  </div></div>
  <div id="dbwarn"></div>
  <div class="panel" id="panel-staff"><form id="form-staff" novalidate></form></div>
  <div class="panel hidden" id="panel-hr"><form id="form-hr" novalidate></form></div>
  <div class="hidden" id="panel-oc">
    <div class="center"><div class="toggle" id="oc-tabs"><button class="active" data-oc="oc3">3ème OC</button><button data-oc="oc4">4ème OC</button></div></div>
    <div class="panel" id="panel-oc3"><form id="form-oc3" novalidate></form></div>
    <div class="panel hidden" id="panel-oc4"><form id="form-oc4" novalidate></form></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/autosave.js"></script>
<script src="js/candidature.js"></script>
<script>renderNav('candidature');</script>
</body>
</html>
